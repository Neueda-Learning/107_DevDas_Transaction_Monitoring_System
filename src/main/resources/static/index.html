      const form = el(`<form id="ruleForm">
        <div class="form-grid">
          <label class="field full"><span class="lbl">Rule name <span class="req">*</span></span><input class="input" name="name" required maxlength="120" placeholder="e.g. High-value payment review" value="${esc(v.name || '')}"></label>
          <label class="field"><span class="lbl">Rule type <span class="req">*</span></span><select class="select" name="type">${optionList(['AMOUNT_THRESHOLD','VELOCITY','NEW_PAYEE','DAILY_LIMIT'], v.type || 'AMOUNT_THRESHOLD', t => RULE_TYPE_LABEL[t])}</select></label>
          <label class="field"><span class="lbl">Severity <span class="req">*</span></span><select class="select" name="severity">${optionList(['HIGH','MEDIUM','LOW'], v.severity || 'MEDIUM')}</select></label>
          <div class="full" id="ruleParams"></div>
          <label class="field full" style="display:flex;align-items:center;gap:9px;cursor:pointer;margin-top:2px"><input type="checkbox" name="active" ${v.active === false ? '' : 'checked'} style="width:16px;height:16px;accent-color:var(--accent)"><span class="lbl" style="margin:0">Rule is active</span></label>
        </div>
      </form>`);
      const typeSel = form.querySelector('[name=type]');
      const params = form.querySelector('#ruleParams');
      const renderParams = () => {
        const t = typeSel.value;
        if (t === 'AMOUNT_THRESHOLD' || t === 'DAILY_LIMIT') {
          params.innerHTML = `<label class="field"><span class="lbl">${t === 'DAILY_LIMIT' ? 'Daily limit amount' : 'Threshold amount'} <span class="req">*</span></span><input class="input num" name="amountThreshold" type="number" step="0.01" min="0.01" required placeholder="10000.00" value="${esc(v.amountThreshold ?? '')}"><div class="hint">${t === 'DAILY_LIMIT' ? 'Alert when an account\'s daily total exceeds this.' : 'Alert when a single transaction exceeds this.'}</div></label>`;
        } else if (t === 'VELOCITY') {
          params.innerHTML = `<div class="form-grid" style="margin:0">
            <label class="field"><span class="lbl">Max transactions <span class="req">*</span></span><input class="input num" name="transactionCountThreshold" type="number" min="1" step="1" required placeholder="5" value="${esc(v.transactionCountThreshold ?? '')}"></label>
            <label class="field"><span class="lbl">Time window (minutes) <span class="req">*</span></span><input class="input num" name="timeWindowMinutes" type="number" min="1" step="1" required placeholder="10" value="${esc(v.timeWindowMinutes ?? '')}"></label>
            <div class="hint full" style="margin-top:-4px">Alert when an account exceeds the transaction count within the window.</div></div>`;
        } else {
          params.innerHTML = `<div class="hint" style="padding:10px 12px;background:var(--surface-2);border-radius:var(--radius-sm)">This rule alerts on the first-ever payment from an account to a new payee. No thresholds needed.</div>`;
        }
      };
      typeSel.addEventListener('change', renderParams);
      renderParams();
      return form;
    }
    function openRuleForm(existing) {
      const isEdit = !!existing;
      const form = ruleFormFields(existing || {});
      let submitBtn;
      const footer = footerButtons([
        { label: 'Cancel', class: 'btn-ghost', onClick: closeModal },
        { label: isEdit ? 'Save changes' : 'Create rule', class: 'btn-primary', ref: b => submitBtn = b, onClick: submit },
      ]);
      openModal({ title: isEdit ? 'Edit rule' : 'New monitoring rule', sub: isEdit ? existing.name : 'Define how transactions are screened.', body: form, footer });
      form.addEventListener('submit', e => { e.preventDefault(); submit(); });
      async function submit() {
        if (!form.reportValidity()) return;
        const fd = new FormData(form);
        const type = fd.get('type');
        const payload = {
          name: fd.get('name').trim(), type, severity: fd.get('severity'),
          active: fd.get('active') === 'on',
          amountThreshold: (type === 'AMOUNT_THRESHOLD' || type === 'DAILY_LIMIT') ? Number(fd.get('amountThreshold')) : null,
          transactionCountThreshold: type === 'VELOCITY' ? Number(fd.get('transactionCountThreshold')) : null,
          timeWindowMinutes: type === 'VELOCITY' ? Number(fd.get('timeWindowMinutes')) : null,
        };
        busy(submitBtn, true, 'Saving…');
        try {
          if (isEdit) await api('/rules/' + existing.id, { method: 'PUT', body: JSON.stringify(payload) });
          else await api('/rules', { method: 'POST', body: JSON.stringify(payload) });
          closeModal();
          toast('ok', isEdit ? 'Rule updated' : 'Rule created', payload.name);
          if (currentRoute === 'rules') { loadRules($('#view')); loadRuleStats($('#view')); }
        } catch (e) { toastError(e); busy(submitBtn, false); }
      }
    }
    async function toggleRule(rule, view) {
      try {
        await api('/rules/' + rule.id + '/status', { method: 'PATCH', body: JSON.stringify({ active: !rule.active }) });
        toast('ok', rule.active ? 'Rule disabled' : 'Rule enabled', rule.name);
        loadRules(view); loadRuleStats(view);
      } catch (e) { toastError(e); }
    }
    function deleteRule(rule, view) {
      const body = el(`<div><p style="margin:0;font-size:14px">Delete <b>${esc(rule.name)}</b>? It will be deactivated and removed from the active rule set. This can be reversed by your administrator.</p></div>`);
      let btn;
      const footer = footerButtons([
        { label: 'Cancel', class: 'btn-ghost', onClick: closeModal },
        { label: 'Delete rule', class: 'btn-danger', ref: b => btn = b, onClick: confirm },
      ]);
      openModal({ title: 'Delete rule', body, footer });
      async function confirm() {
        busy(btn, true, 'Deleting…');
        try { await api('/rules/' + rule.id, { method: 'DELETE' }); closeModal(); toast('ok', 'Rule deleted', rule.name); loadRules(view); loadRuleStats(view); }
        catch (e) { toastError(e); busy(btn, false); }
      }
    }
    async function openRuleHistory(rule) {
      const body = el('<div>' + skeletonRows(1, 4).replace(/<\/?t[rd][^>]*>/g, '') + '<div class="skeleton" style="height:40px;margin-bottom:10px"></div><div class="skeleton" style="height:40px"></div></div>');
      openModal({ title: 'Audit history', sub: rule.name, body, wide: true });
      try {
        let hist = await api('/rules/' + rule.id + '/history');
        if (!Array.isArray(hist)) hist = [];
        hist.sort((a, b) => new Date(b.changedAt) - new Date(a.changedAt));
        if (!hist.length) { body.innerHTML = emptyState('No history', 'No changes have been recorded for this rule.'); return; }
        const actionTone = { CREATED: 'green', UPDATED: 'blue', ACTIVATED: 'green', DEACTIVATED: 'amber', DELETED: 'red' };
        body.innerHTML = `<ul class="timeline">${hist.map(h => `<li>
          <span class="tl-dot" style="border-color:var(--${actionTone[h.action] || 'gray'})"></span>
          <div class="tl-top"><span class="badge b-${actionTone[h.action] || 'gray'} no-dot">${esc(titleCase(h.action))}</span><span class="tl-time">· ${fmtDate(h.changedAt)}</span></div>
          <div class="tl-by">by ${esc(h.changedBy || 'system')}</div>
          ${h.newValues ? `<pre class="json">${esc(prettyJson(h.newValues))}</pre>` : ''}
        </li>`).join('')}</ul>`;
      } catch (e) { body.innerHTML = emptyState('Could not load history', e.message); }
    }
    function prettyJson(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return String(s); } }

    // ============================================================
    // Settings
    // ============================================================
    function openSettings() {
      const form = el(`<form id="setForm">
        <label class="field" style="margin-bottom:15px"><span class="lbl">Operator name</span>
          <input class="input" name="operator" value="${esc(CFG.operator)}" placeholder="analyst-01">
          <div class="hint">Your actions (alert updates) are recorded under this name.</div></label>
        <label class="field"><span class="lbl">API base URL</span>
          <input class="input mono" name="base" value="${esc(CFG.base)}" placeholder="/api/v1">
          <div class="hint">Leave as <span class="mono">/api/v1</span> when served by the backend. Change only if the API runs elsewhere.</div></label>
      </form>`);
      let btn;
      const footer = footerButtons([
        { label: 'Cancel', class: 'btn-ghost', onClick: closeModal },
        { label: 'Save', class: 'btn-primary', ref: b => btn = b, onClick: save },
      ]);
      openModal({ title: 'Settings', body: form, footer });
      function save() {
        const fd = new FormData(form);
        CFG.operator = (fd.get('operator').trim() || 'operator-01');
        CFG.base = (fd.get('base').trim() || '/api/v1').replace(/\/$/, '');
        store.set('tms.operator', CFG.operator); store.set('tms.base', CFG.base);
        $('#operatorChip').textContent = CFG.operator;
        closeModal(); toast('ok', 'Settings saved'); checkHealth(); refreshAlertBadge();
      }
    }

    // ============================================================
    // Theme
    // ============================================================
    const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    function currentTheme() {
      const t = store.get('tms.theme', '');
      if (t) return t;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme() {
      const saved = store.get('tms.theme', '');
      document.documentElement.setAttribute('data-theme', saved || '');
      const dark = currentTheme() === 'dark';
      $('#themeIcon').innerHTML = dark ? SUN : MOON;
      $('#themeBtn').title = dark ? 'Switch to light mode' : 'Switch to dark mode';
    }
    function toggleTheme() {
      const dark = currentTheme() === 'dark';
      store.set('tms.theme', dark ? 'light' : 'dark');
      applyTheme();
    }
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!store.get('tms.theme', '')) applyTheme(); });

    // ============================================================
    // Health check
    // ============================================================
    async function checkHealth() {
      const dot = $('#healthDot'), txt = $('#healthText');
      dot.className = 'dot'; txt.textContent = 'Checking API…';
      try {
        await api('/rules/stats');
        dot.className = 'dot ok'; txt.textContent = 'API connected';
      } catch (e) {
        dot.className = 'dot down';
        txt.textContent = e.status ? `API error (${e.status})` : 'API unreachable';
      }
    }

    // ============================================================
    // Router
    // ============================================================
    const ROUTES = {
      dashboard: { title: 'Dashboard', render: viewDashboard },
      generate: { title: 'Generate', render: viewGenerate },
      transactions: { title: 'Transactions', render: viewTransactions },
      alerts: { title: 'Alerts', render: viewAlerts },
      rules: { title: 'Rules', render: viewRules },
    };
    let currentRoute = 'dashboard';
    function navigate(route) {
      if (!ROUTES[route]) route = 'dashboard';
      currentRoute = route;
      if (location.hash !== '#' + route) history.replaceState(null, '', '#' + route);
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === route));
      $('#pageTitle').textContent = ROUTES[route].title;
      closeSidebar();
      const view = $('#view');
      view.innerHTML = '';
      Promise.resolve(ROUTES[route].render(view)).catch(e => {
        view.innerHTML = emptyState('Something went wrong', e.message);
      });
    }
    function wireRouteLinks(root) {
      root.querySelectorAll('[data-route]').forEach(a => a.onclick = (e) => { e.preventDefault(); navigate(a.dataset.route); });
    }

    // Mobile sidebar
    function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').style.display = 'block'; }
    function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').style.display = 'none'; }

    // ============================================================
    // Init
    // ============================================================
    function init() {
      applyTheme();
      $('#operatorChip').textContent = CFG.operator;
      document.querySelectorAll('.nav-item').forEach(n => n.onclick = (e) => { e.preventDefault(); navigate(n.dataset.route); });
      $('#themeBtn').onclick = toggleTheme;
      $('#settingsBtn').onclick = openSettings;
      $('#menuToggle').onclick = openSidebar;
      $('#scrim').onclick = closeSidebar;
      window.addEventListener('hashchange', () => navigate(location.hash.replace('#', '')));
      navigate(location.hash.replace('#', '') || 'dashboard');
      checkHealth();
      refreshAlertBadge();
      setInterval(refreshAlertBadge, 60000);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
</body>
</html>
