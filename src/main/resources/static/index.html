<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Monitoring</title>
  <style>
    /* ============================================================
       Design tokens
       ============================================================ */
    :root {
      --bg:        #f5f6f8;
      --surface:   #ffffff;
      --surface-2: #f1f3f5;
      --border:    #e5e8ec;
      --border-strong: #d4d9df;
      --text:      #14161a;
      --text-muted:#5b636e;
      --text-soft: #8a919c;
      --accent:    #db0011;
      --accent-hover:#b3000e;
      --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
      --shadow:    0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
      --shadow-lg: 0 14px 40px rgba(16,24,40,.14), 0 4px 8px rgba(16,24,40,.06);
      --radius:    12px;
      --radius-sm: 8px;

      --red:    #db0011;
      --amber:  #e07b00;
      --green:  #1f9d57;
      --blue:   #2f6fed;
      --purple: #7a41d6;
      --gray:   #6b7684;

      --sidebar-w: 244px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    :root[data-theme="dark"] {
      --bg:        #08080a;
      --surface:   #131316;
      --surface-2: #1c1c21;
      --border:    #29292f;
      --border-strong: #3a3a42;
      --text:      #f1f2f4;
      --text-muted:#a2a6ad;
      --text-soft: #6d7178;
      --accent:    #ff2d40;
      --accent-hover:#ff5261;
      --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
      --shadow:    0 1px 2px rgba(0,0,0,.5);
      --shadow-lg: 0 16px 40px rgba(0,0,0,.6);

      --red:    #ff3b4a;
      --amber:  #f0a53a;
      --green:  #3fca7f;
      --blue:   #5b8def;
      --purple: #a684ec;
      --gray:   #8b909a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #08080a;
        --surface:   #131316;
        --surface-2: #1c1c21;
        --border:    #29292f;
        --border-strong: #3a3a42;
        --text:      #f1f2f4;
        --text-muted:#a2a6ad;
        --text-soft: #6d7178;
        --accent:    #ff2d40;
        --accent-hover:#ff5261;
        --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
        --shadow:    0 1px 2px rgba(0,0,0,.5);
        --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
        --red:#ff3b4a; --amber:#f0a53a; --green:#3fca7f; --blue:#5b8def; --purple:#a684ec; --gray:#8b909a;
      }
    }

    /* ============================================================
       Base
       ============================================================ */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
    ::selection { background: var(--accent-soft); }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-soft); }

    /* ============================================================
       Layout
       ============================================================ */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
    }
    .brand {
      display: flex; align-items: center; gap: 11px;
      padding: 20px 20px 18px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--accent); color: #fff;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-weight: 650; font-size: 14.5px; line-height: 1.15; }
    .brand-sub { font-size: 11px; color: var(--text-soft); letter-spacing: .02em; }

    .nav { padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
    .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-soft); padding: 14px 10px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 10px; border-radius: var(--radius-sm);
      color: var(--text-muted); font-weight: 500; cursor: pointer;
      border: 1px solid transparent; user-select: none;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav-item.active svg { opacity: 1; }
    .nav-badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--red);
      color:#fff; border-radius: 20px; padding: 1px 7px; min-width: 20px; text-align: center; }
    :root[data-theme="dark"] .nav-badge { color:#fff; }

    .sidebar-foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--border); }
    .health { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
    .dot.ok { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
    .dot.down { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 22%, transparent); }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 60px; flex-shrink: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 0 26px; border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20;
    }
    .topbar .page-title { font-size: 18px; font-weight: 650; }
    .topbar .spacer { flex: 1; }

    .content { padding: 26px; max-width: 1240px; width: 100%; margin: 0 auto; }

    /* ============================================================
       Buttons / controls
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 36px; padding: 0 14px; border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 550; font-family: inherit;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, opacity .12s;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: translateY(.5px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-icon { width: 36px; padding: 0; }
    .btn-sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
    .btn-danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--border-strong)); }
    .btn-danger:hover { background: color-mix(in srgb, var(--red) 10%, transparent); }

    .input, .select, textarea.input {
      height: 36px; width: 100%; padding: 0 11px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-family: inherit; font-size: 13.5px;
      transition: border-color .12s, box-shadow .12s;
    }
    textarea.input { height: auto; padding: 9px 11px; resize: vertical; min-height: 72px; line-height: 1.5; }
    .input:focus, .select:focus, textarea.input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .select {
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23808a97' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 9px center; padding-right: 30px;
    }
    label.field { display: block; }
    label.field > .lbl { display: block; font-size: 12.5px; font-weight: 550; margin-bottom: 6px; color: var(--text-muted); }
    label.field > .lbl .req { color: var(--red); }
    .hint { font-size: 12px; color: var(--text-soft); margin-top: 5px; }

    .search {
      position: relative; flex: 1; max-width: 320px; min-width: 150px;
    }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--text-soft); }
    .search .input { padding-left: 34px; }

    /* ============================================================
       Cards / surfaces
       ============================================================ */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
    .card-head h3 { font-size: 14.5px; }
    .card-head .spacer { flex: 1; }
    .card-body { padding: 18px; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
    @media (max-width: 900px){ .stat-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 520px){ .stat-grid { grid-template-columns: 1fr; } }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .stat .stat-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .stat .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
    .stat .ico svg { width: 18px; height: 18px; }
    .stat .stat-label { font-size: 12.5px; color: var(--text-muted); font-weight: 550; }
    .stat .stat-value { font-size: 27px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat .stat-foot { font-size: 12px; color: var(--text-soft); margin-top: 5px; }
    .tone-red   .ico { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
    .tone-amber .ico { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
    .tone-green .ico { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
    .tone-blue  .ico { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
    .tone-purple .ico{ background: color-mix(in srgb, var(--purple) 14%, transparent); color: var(--purple); }

    /* ============================================================
       Tables
       ============================================================ */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th {
      text-align: left; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-soft); padding: 11px 16px; border-bottom: 1px solid var(--border);
      white-space: nowrap; background: var(--surface); position: sticky; top: 0;
    }
    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover td { background: var(--surface-2); }
    td .mono, .mono { font-family: var(--mono); font-size: 12.5px; }
    td .num, .num { font-variant-numeric: tabular-nums; }
    .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
    .t-muted { color: var(--text-muted); }
    .t-soft { color: var(--text-soft); }
    .nowrap { white-space: nowrap; }

    /* ============================================================
       Badges
       ============================================================ */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600;
      line-height: 1.6; white-space: nowrap;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.no-dot::before { display: none; }
    .badge.b-red    { color: var(--red);    background: color-mix(in srgb, var(--red) 13%, transparent); }
    .badge.b-amber  { color: var(--amber);  background: color-mix(in srgb, var(--amber) 15%, transparent); }
    .badge.b-green  { color: var(--green);  background: color-mix(in srgb, var(--green) 13%, transparent); }
    .badge.b-blue   { color: var(--blue);   background: color-mix(in srgb, var(--blue) 13%, transparent); }
    .badge.b-purple { color: var(--purple); background: color-mix(in srgb, var(--purple) 14%, transparent); }
    .badge.b-gray   { color: var(--gray);   background: color-mix(in srgb, var(--gray) 15%, transparent); }

    .filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
    .filters .fg { display: flex; flex-direction: column; gap: 6px; }
    .filters .fg .lbl { font-size: 11.5px; font-weight: 550; color: var(--text-soft); }
    .filters .select, .filters .input { height: 34px; min-width: 130px; }

    /* Pagination */
    .pager { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--border); }
    .pager .info { font-size: 12.5px; color: var(--text-muted); }
    .pager .spacer { flex: 1; }

    /* Empty / loading states */
    .empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty svg { width: 40px; height: 40px; opacity: .4; margin-bottom: 12px; }
    .empty h4 { font-size: 15px; margin-bottom: 4px; color: var(--text); }
    .empty p { font-size: 13px; color: var(--text-soft); margin: 0; }
    .skeleton-row td { padding: 14px 16px; }
    .skeleton { height: 12px; border-radius: 5px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
      background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
    @keyframes shimmer { 0%{background-position: 100% 0;} 100%{background-position: -100% 0;} }

    /* ============================================================
       Modal
       ============================================================ */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,20,28,.5);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 40px 16px; z-index: 100; overflow-y: auto;
      opacity: 0; animation: fade .15s ease forwards;
    }
    :root[data-theme="dark"] .overlay { background: rgba(0,0,0,.62); }
    @keyframes fade { to { opacity: 1; } }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
      box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; margin: auto 0;
      transform: translateY(6px) scale(.99); animation: pop .16s ease forwards;
    }
    .modal.wide { max-width: 760px; }
    @keyframes pop { to { transform: none; } }
    .modal-head { display: flex; align-items: flex-start; gap: 14px; padding: 20px 22px 0; }
    .modal-head .mh-text { flex: 1; }
    .modal-head h2 { font-size: 17px; }
    .modal-head .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 3px; }
    .modal-body { padding: 20px 22px; }
    .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 22px; border-top: 1px solid var(--border); }
    .close-x { background: transparent; border: none; color: var(--text-soft); cursor: pointer; padding: 5px; border-radius: 7px; display: grid; place-items:center; }
    .close-x:hover { background: var(--surface-2); color: var(--text); }
    .close-x svg { width: 18px; height: 18px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 520px){ .form-grid { grid-template-columns: 1fr; } }

    /* Detail rows */
    .detail-list { display: grid; grid-template-columns: 140px 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .detail-list dt { background: var(--surface-2); padding: 9px 13px; font-size: 12.5px; color: var(--text-muted); font-weight: 550; margin: 0; }
    .detail-list dd { background: var(--surface); padding: 9px 13px; margin: 0; font-size: 13px; word-break: break-word; }

    .section-title { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); margin: 22px 0 10px; }

    /* Timeline */
    .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
    .timeline::before { content:""; position:absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .timeline li { position: relative; padding: 0 0 16px 26px; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline .tl-dot { position: absolute; left: 0; top: 3px; width: 14px; height: 14px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--accent); }
    .timeline .tl-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .timeline .tl-time { font-size: 12px; color: var(--text-soft); }
    .timeline .tl-note { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    .timeline .tl-by { font-size: 12px; color: var(--text-soft); }
    pre.json { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 12px; font-family: var(--mono); font-size: 12px; overflow-x: auto; margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--text-muted); }

    .arrow { color: var(--text-soft); display: inline-flex; align-items: center; }
    .arrow svg { width: 15px; height: 15px; }

    /* ============================================================
       Toasts
       ============================================================ */
    .toasts { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
    .toast { display: flex; align-items: flex-start; gap: 11px; padding: 13px 15px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
      transform: translateX(20px); opacity: 0; animation: toastin .2s ease forwards; }
    @keyframes toastin { to { transform: none; opacity: 1; } }
    .toast.out { animation: toastout .2s ease forwards; }
    @keyframes toastout { to { transform: translateX(20px); opacity: 0; } }
    .toast .ti { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
    .toast.ok .ti { color: var(--green); }
    .toast.err .ti { color: var(--red); }
    .toast.info .ti { color: var(--accent); }
    .toast .tt { font-weight: 600; font-size: 13.5px; }
    .toast .tm { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .toast .tclose { margin-left: auto; }

    .mt-0 { margin-top: 0; } .mb-16 { margin-bottom: 16px; }
    .flex { display: flex; } .items-center { align-items: center; } .gap-8 { gap: 8px; }
    .txn-chip { display:inline-flex; align-items:center; gap:6px; padding: 4px 9px; border:1px solid var(--border); border-radius: 20px; font-size:12px; }

    /* ============================================================
       Hero banner
       ============================================================ */
    .hero {
      position: relative; overflow: hidden;
      border-radius: 16px; margin-bottom: 22px;
      padding: 26px 28px; color: #fff;
      background: linear-gradient(115deg, #db0011 0%, #a3000d 42%, #14161a 100%);
      box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    .hero::before {
      content: ""; position: absolute; right: -60px; top: -80px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.14), transparent 62%);
      pointer-events: none;
    }
    .hero .hex { position: absolute; right: 210px; top: 50%; transform: translateY(-50%); width: 150px; height: 150px; opacity: .10; pointer-events: none; }
    .hero-text { position: relative; z-index: 1; }
    .hero-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .82; }
    .hero h2 { font-size: 23px; margin: 6px 0 5px; letter-spacing: -.02em; }
    .hero p { margin: 0; opacity: .85; font-size: 13.5px; max-width: 46ch; }
    .hero-kpis { position: relative; z-index: 1; margin-left: auto; display: flex; gap: 30px; }
    .hero-kpi .hk-value { font-size: 40px; font-weight: 760; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .hero-kpi .hk-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; opacity: .82; margin-top: 6px; }
    .hero-kpi .hk-sep { width: 1px; background: rgba(255,255,255,.22); }
    @media (max-width: 680px){ .hero-kpis { margin-left: 0; gap: 22px; } .hero h2 { font-size: 20px; } }

    /* ============================================================
       Charts
       ============================================================ */
    .analytics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 22px; }
    @media (max-width: 980px){ .analytics { grid-template-columns: 1fr; } }
    .chart-card { min-height: 260px; }
    .chart-card .card-body { display: flex; flex-direction: column; }
    .chart-donut { position: relative; width: 172px; height: 172px; margin: 6px auto 2px; }
    .chart-donut svg { display: block; transform: rotate(-90deg); }
    .chart-donut svg circle { transition: stroke-dasharray .7s cubic-bezier(.4,0,.2,1); }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .dc-value { font-size: 30px; font-weight: 740; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
    .dc-label { font-size: 10.5px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
    .legend { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
    .legend li { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .lg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .lg-label { color: var(--text-muted); }
    .lg-val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 650; }
    .bars { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label { width: 116px; font-size: 12.5px; color: var(--text-muted); flex-shrink: 0; }
    .bar-track { flex: 1; height: 11px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; width: 0; transition: width .8s cubic-bezier(.4,0,.2,1); }
    .bar-val { width: 30px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; font-size: 13px; }
    .chart-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-soft); font-size: 13px; text-align: center; padding: 20px; }

    /* Responsive sidebar */
    .menu-toggle { display: none; }
    @media (max-width: 860px) {
      .sidebar { position: fixed; z-index: 60; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-lg); }
      .sidebar.open { transform: none; }
      .menu-toggle { display: grid; }
      .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        </div>
        <div>
          <div class="brand-name">Transaction Monitor</div>
          <div class="brand-sub">Compliance Console</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" data-route="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-route="generate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/></svg>
          <span>Generate</span>
        </a>
        <a class="nav-item" data-route="alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span>Alerts</span>
          <span class="nav-badge" id="navAlertBadge" style="display:none">0</span>
        </a>
        <a class="nav-item" data-route="transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span>Transactions</span>
        </a>
        <a class="nav-item" data-route="rules">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
          <span>Rules</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="health">
          <span class="dot" id="healthDot"></span>
          <span id="healthText">Checking API…</span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim" style="display:none"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="btn btn-icon btn-ghost menu-toggle" id="menuToggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="spacer"></div>
        <div class="txn-chip" title="Actions are recorded under this operator name">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="operatorChip">operator</span>
        </div>
        <button class="btn btn-icon btn-ghost" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="btn btn-icon btn-ghost" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </header>

      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
  "use strict";
  (function () {
    // ============================================================
    // Config & state
    // ============================================================
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    const CFG = {
      base: store.get('tms.base', '/api/v1'),
      operator: store.get('tms.operator', 'operator-01'),
    };

    // ============================================================
    // Small helpers
    // ============================================================
    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

    function fmtMoney(amount, currency) {
      const n = Number(amount);
      if (!isFinite(n)) return esc(amount);
      let s;
      try { s = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n); }
      catch { s = n.toFixed(2); }
      return (currency ? esc(currency) + ' ' : '') + s;
    }
    function fmtDate(iso, opts) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleString(undefined, opts || { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    function fmtDateShort(iso) { return fmtDate(iso, { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
    function relTime(iso) {
      if (!iso) return '';
      const d = new Date(iso); if (isNaN(d)) return '';
      const s = (Date.now() - d.getTime()) / 1000;
      const u = [[60,'s'],[60,'m'],[24,'h'],[7,'d'],[4.34,'w'],[12,'mo'],[Infinity,'y']];
      let v = Math.abs(s), unit = 's', i = 0, scaled = v;
      for (; i < u.length; i++) { if (scaled < u[i][0]) { unit = u[i][1]; break; } scaled /= u[i][0]; }
      const val = Math.max(1, Math.floor(scaled));
      return s < 45 ? 'just now' : `${val}${unit} ago`;
    }
    function shortId(id) { const s = String(id); return s.length > 10 ? s.slice(0, 8) : s; }
    function titleCase(s) { return String(s).toLowerCase().replace(/(^|_)([a-z])/g, (_, a, b) => (a ? ' ' : '') + b.toUpperCase()); }
    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    // Enum → badge tone
    const SEVERITY_TONE = { HIGH: 'red', MEDIUM: 'amber', LOW: 'blue' };
    const TXN_STATUS_TONE = { COMPLETED: 'green', PENDING: 'amber', FAILED: 'red', PENDING_APPROVAL: 'amber', REJECTED: 'red', ROLLBACK_REQUESTED: 'purple', ROLLBACK_REJECTED: 'red', REFUNDED: 'blue' };
    const ALERT_STATUS_TONE = { OPEN: 'red', ACKNOWLEDGED: 'blue', INVESTIGATING: 'purple', CLOSED: 'green', DISMISSED: 'gray' };
    const TXN_TYPE_TONE = { DEBIT: 'amber', CREDIT: 'green' };
    const RULE_TYPE_LABEL = { AMOUNT_THRESHOLD: 'Amount threshold', VELOCITY: 'Velocity', NEW_PAYEE: 'New payee', DAILY_LIMIT: 'Daily limit' };
    const ACTIVE_ALERT_STATES = ['OPEN', 'ACKNOWLEDGED', 'INVESTIGATING'];
    const ALERT_TRANSITIONS = {
      OPEN: ['ACKNOWLEDGED'],
      ACKNOWLEDGED: ['INVESTIGATING', 'DISMISSED'],
      INVESTIGATING: ['CLOSED', 'DISMISSED'],
      CLOSED: [], DISMISSED: [],
    };

    function badge(value, tone, noDot) {
      if (value == null || value === '') return '<span class="t-soft">—</span>';
      return `<span class="badge b-${tone || 'gray'}${noDot ? ' no-dot' : ''}">${esc(titleCase(value))}</span>`;
    }
    const sevBadge = (s) => badge(s, SEVERITY_TONE[s]);
    const txnStatusBadge = (s) => badge(s, TXN_STATUS_TONE[s]);
    const alertStatusBadge = (s) => badge(s, ALERT_STATUS_TONE[s]);
    const typeBadge = (t) => badge(t, TXN_TYPE_TONE[t], true);

    // ============================================================
    // API layer
    // ============================================================
    async function api(path, opts = {}) {
      const url = CFG.base + path;
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        ...opts,
      });
      let data = null;
      const text = await res.text();
      if (text) { try { data = JSON.parse(text); } catch { data = text; } }
      if (!res.ok) {
        const msg = (data && data.message) ? data.message : `Request failed (${res.status})`;
        const details = (data && Array.isArray(data.details)) ? data.details : [];
        const err = new Error(msg); err.status = res.status; err.details = details;
        throw err;
      }
      return data;
    }
    const qs = (obj) => {
      const p = new URLSearchParams();
      Object.entries(obj).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') p.append(k, v); });
      const s = p.toString(); return s ? '?' + s : '';
    };

    // ============================================================
    // Toasts
    // ============================================================
    const ICONS = {
      ok: '<path d="M20 6L9 17l-5-5"/>',
      err: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
      info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    };
    function toast(kind, title, msg) {
      const t = el(`<div class="toast ${kind}">
        <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[kind] || ICONS.info}</svg>
        <div><div class="tt">${esc(title)}</div>${msg ? `<div class="tm">${esc(msg)}</div>` : ''}</div>
        <button class="close-x tclose" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>`);
      const remove = () => { t.classList.add('out'); setTimeout(() => t.remove(), 200); };
      t.querySelector('.tclose').onclick = remove;
      $('#toasts').appendChild(t);
      if (kind !== 'err') setTimeout(remove, 4200);
      else setTimeout(remove, 7000);
    }
    function toastError(e) { toast('err', e.message || 'Something went wrong', (e.details && e.details.length) ? e.details.join(' · ') : ''); }

    // ============================================================
    // Modal
    // ============================================================
    let modalEl = null;
    function openModal({ title, sub, body, footer, wide }) {
      closeModal();
      const overlay = el(`<div class="overlay"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        <div class="modal-head"><div class="mh-text"><h2>${esc(title)}</h2>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
        <button class="close-x" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <div class="modal-body"></div>
        ${footer ? '<div class="modal-foot"></div>' : ''}
      </div></div>`);
      overlay.querySelector('.modal-body').append(body);
      if (footer) overlay.querySelector('.modal-foot').append(footer);
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
      overlay.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      modalEl = overlay;
      const focusable = overlay.querySelector('input, select, textarea, button.btn-primary');
      if (focusable) setTimeout(() => focusable.focus(), 50);
      return overlay;
    }
    function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; document.body.style.overflow = ''; } }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // Build a footer with buttons
    function footerButtons(buttons) {
      const f = document.createDocumentFragment();
      buttons.forEach(b => {
        const btn = el(`<button class="btn ${b.class || ''}">${b.icon || ''}${esc(b.label)}</button>`);
        btn.onclick = b.onClick;
        if (b.ref) b.ref(btn);
        f.append(btn);
      });
      return f;
    }
    function busy(btn, on, labelBusy) {
      if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = labelBusy || 'Working…'; }
      else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
    }

    // ============================================================
    // Reusable render bits
    // ============================================================
    function emptyState(title, sub, icon) {
      return `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icon || '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'}</svg>
        <h4>${esc(title)}</h4><p>${esc(sub || '')}</p></div>`;
    }
    function skeletonRows(cols, rows = 5) {
      let out = '';
      for (let i = 0; i < rows; i++) {
        out += '<tr class="skeleton-row">';
        for (let c = 0; c < cols; c++) out += `<td><div class="skeleton" style="width:${40 + Math.random() * 45}%"></div></td>`;
        out += '</tr>';
      }
      return out;
    }
    function optionList(values, current, labelFn) {
      return values.map(v => `<option value="${esc(v)}" ${current === v ? 'selected' : ''}>${esc(labelFn ? labelFn(v) : titleCase(v))}</option>`).join('');
    }

    // ---- Charts (pure SVG/CSS, no libraries) ----
    function donutChart(segments, { centerValue, centerLabel } = {}) {
      const total = segments.reduce((s, x) => s + x.value, 0);
      const size = 172, thickness = 24, r = (size - thickness) / 2, c = size / 2, circ = 2 * Math.PI * r;
      let offset = 0;
      const ring = total === 0
        ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--border)" stroke-width="${thickness}"/>`
        : segments.filter(s => s.value > 0).map(s => {
            const len = s.value / total * circ;
            const seg = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${s.color}" stroke-width="${thickness}" stroke-dasharray="${len.toFixed(2)} ${(circ - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"><title>${esc(s.label)}: ${s.value}</title></circle>`;
            offset += len; return seg;
          }).join('');
      return `<div class="chart-donut">
        <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${ring}</svg>
        <div class="donut-center"><div class="dc-value">${centerValue != null ? centerValue : total}</div><div class="dc-label">${esc(centerLabel || '')}</div></div>
      </div>`;
    }
    function chartLegend(segments) {
      const total = segments.reduce((s, x) => s + x.value, 0);
      return `<ul class="legend">${segments.map(s => {
        const pct = total ? Math.round(s.value / total * 100) : 0;
        return `<li><span class="lg-dot" style="background:${s.color}"></span><span class="lg-label">${esc(s.label)}</span><span class="lg-val">${s.value} · ${pct}%</span></li>`;
      }).join('')}</ul>`;
    }
    function barChart(items) {
      const max = Math.max(1, ...items.map(i => i.value));
      return `<div class="bars">${items.map(i => `
        <div class="bar-row"><div class="bar-label">${esc(i.label)}</div>
        <div class="bar-track"><div class="bar-fill" data-w="${(i.value / max * 100).toFixed(1)}" style="background:${i.color}"></div></div>
        <div class="bar-val">${i.value}</div></div>`).join('')}</div>`;
    }
    function animateBars(root) {
      requestAnimationFrame(() => root.querySelectorAll('.bar-fill').forEach(b => { b.style.width = b.dataset.w + '%'; }));
    }

    // ============================================================
    // VIEW: Dashboard
    // ============================================================
    async function viewDashboard(view) {
      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
      view.innerHTML = `
        <div class="hero">
          <svg class="hex" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,3 97,50 50,97 3,50" fill="#fff"/><polygon points="50,3 97,50 50,50" fill="#db0011"/><polygon points="50,50 3,50 50,97" fill="#db0011"/></svg>
          <div class="hero-text">
            <div class="hero-eyebrow">Transaction Monitoring</div>
            <h2>${esc(greeting)}, ${esc(CFG.operator)}</h2>
            <p>Live view of alerts, transaction flow and rule coverage across the monitored estate.</p>
          </div>
          <div class="hero-kpis">
            <div class="hero-kpi"><div class="hk-value" id="kpiOpen">—</div><div class="hk-label">Open alerts</div></div>
            <div class="hk-sep"></div>
            <div class="hero-kpi"><div class="hk-value" id="kpiHigh">—</div><div class="hk-label">High severity</div></div>
            <div class="hk-sep"></div>
            <div class="hero-kpi"><div class="hk-value" id="kpiRules">—</div><div class="hk-label">Active rules</div></div>
          </div>
        </div>

        <div class="stat-grid" id="dashSummary">
          ${['blue','purple','amber','red'].map(t => `<div class="stat tone-${t}"><div class="stat-top"><div class="ico"></div><div class="stat-label"><div class="skeleton" style="width:80px;height:11px"></div></div></div><div class="skeleton" style="width:50px;height:24px"></div></div>`).join('')}
        </div>
        <div class="analytics">
          <div class="card chart-card"><div class="card-head"><h3>Transactions by status</h3></div><div class="card-body" id="chartTxn"><div class="chart-empty">Loading…</div></div></div>
          <div class="card chart-card"><div class="card-head"><h3>Alerts by severity</h3></div><div class="card-body" id="chartSev"><div class="chart-empty">Loading…</div></div></div>
          <div class="card chart-card"><div class="card-head"><h3>Rules by type</h3></div><div class="card-body" id="chartRules"><div class="chart-empty">Loading…</div></div></div>
        </div>

        <div style="display:grid;grid-template-columns:1.35fr 1fr;gap:18px" id="dashCols">
          <div class="card" id="recentAlertsCard"><div class="card-head"><h3>Recent alerts</h3><div class="spacer"></div><a class="btn btn-sm btn-ghost" data-route="alerts">View all</a></div><div class="table-wrap"><table><tbody>${skeletonRows(3,4)}</tbody></table></div></div>
          <div class="card" id="recentTxnCard"><div class="card-head"><h3>Recent transactions</h3><div class="spacer"></div><a class="btn btn-sm btn-ghost" data-route="transactions">View all</a></div><div class="table-wrap"><table><tbody>${skeletonRows(2,4)}</tbody></table></div></div>
        </div>`;
      wireRouteLinks(view);
      const cols = $('#dashCols', view);
      const applyResponsive = () => { cols.style.gridTemplateColumns = window.innerWidth < 900 ? '1fr' : '1.35fr 1fr'; };
      applyResponsive(); window.addEventListener('resize', applyResponsive);

      const [alerts, stats, txnPage, txnComp, txnPend, txnFail, summary] = await Promise.allSettled([
        api('/alerts'),
        api('/rules/stats'),
        api('/transactions' + qs({ page: 0, size: 6, sortBy: 'transactionTime', sortDir: 'desc' })),
        api('/transactions' + qs({ status: 'COMPLETED', size: 1 })),
        api('/transactions' + qs({ status: 'PENDING_APPROVAL', size: 1 })),
        api('/transactions' + qs({ status: 'FAILED', size: 1 })),
        api('/dashboard/summary'),
      ]);

      if (summary.status === 'fulfilled') {
        const s = summary.value;
        const cards = [
          { tone: 'blue', label: 'Total transactions', value: s.totalTransactions, icon: '<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>' },
          { tone: 'purple', label: 'Total alerts', value: s.totalAlerts, icon: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>' },
          { tone: 'amber', label: 'Active alerts', value: s.activeAlerts, icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
          { tone: 'red', label: 'Open alerts', value: s.openAlerts, icon: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
        ];
        $('#dashSummary', view).innerHTML = cards.map(c => `
          <div class="stat tone-${c.tone}"><div class="stat-top"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></div><div class="stat-label">${c.label}</div></div><div class="stat-value">${Number(c.value).toLocaleString()}</div></div>`).join('');
      } else {
        $('#dashSummary', view).innerHTML = `<div class="card" style="grid-column:1/-1"><div class="card-body t-soft" style="font-size:13px">Summary unavailable: ${esc(summary.reason?.message || '')}</div></div>`;
      }

      const alertList = alerts.status === 'fulfilled' && Array.isArray(alerts.value) ? alerts.value : [];
      const openCount = alertList.filter(a => ACTIVE_ALERT_STATES.includes(a.status)).length;
      const highOpen = alertList.filter(a => a.severity === 'HIGH' && ACTIVE_ALERT_STATES.includes(a.status)).length;
      const st = stats.status === 'fulfilled' ? stats.value : null;

      // Hero KPIs
      $('#kpiOpen', view).textContent = alerts.status === 'fulfilled' ? openCount : '—';
      $('#kpiHigh', view).textContent = alerts.status === 'fulfilled' ? highOpen : '—';
      $('#kpiRules', view).textContent = st ? st.activeRules : '—';

      // Chart: transactions by status (donut)
      const cnt = (r) => r.status === 'fulfilled' ? Number(r.value.totalElements) : 0;
      const txnOk = txnComp.status === 'fulfilled' && txnPend.status === 'fulfilled' && txnFail.status === 'fulfilled';
      const txnSegs = [
        { label: 'Completed', value: cnt(txnComp), color: 'var(--green)' },
        { label: 'Pending For Approval', value: cnt(txnPend), color: 'var(--amber)' },
        { label: 'Failed', value: cnt(txnFail), color: 'var(--red)' },
      ];
      const txnTotal = txnSegs.reduce((s, x) => s + x.value, 0);
      $('#chartTxn', view).innerHTML = !txnOk
        ? '<div class="chart-empty">Transaction data unavailable.</div>'
        : txnTotal === 0
          ? '<div class="chart-empty">No transactions recorded yet.</div>'
          : donutChart(txnSegs, { centerValue: Number(txnTotal).toLocaleString(), centerLabel: 'Total' }) + chartLegend(txnSegs);

      // Chart: alerts by severity (donut)
      const sevSegs = [
        { label: 'High', value: alertList.filter(a => a.severity === 'HIGH').length, color: 'var(--red)' },
        { label: 'Medium', value: alertList.filter(a => a.severity === 'MEDIUM').length, color: 'var(--amber)' },
        { label: 'Low', value: alertList.filter(a => a.severity === 'LOW').length, color: 'var(--gray)' },
      ];
      $('#chartSev', view).innerHTML = alerts.status !== 'fulfilled'
        ? '<div class="chart-empty">Alert data unavailable.</div>'
        : alertList.length === 0
          ? '<div class="chart-empty">No alerts raised yet.</div>'
          : donutChart(sevSegs, { centerValue: alertList.length, centerLabel: 'Alerts' }) + chartLegend(sevSegs);

      // Chart: rules by type (bars)
      const rulesBox = $('#chartRules', view);
      if (!st) rulesBox.innerHTML = '<div class="chart-empty">Rule statistics unavailable.</div>';
      else if (st.totalRules === 0) rulesBox.innerHTML = '<div class="chart-empty">No rules configured yet.</div>';
      else {
        const byType = st.rulesByType || {};
        const items = ['AMOUNT_THRESHOLD', 'VELOCITY', 'NEW_PAYEE', 'DAILY_LIMIT'].map(t => ({ label: RULE_TYPE_LABEL[t] || t, value: Number(byType[t] || 0), color: 'var(--accent)' }));
        rulesBox.innerHTML = barChart(items);
        animateBars(rulesBox);
      }

      // Recent alerts
      const raCard = $('#recentAlertsCard', view);
      const raBody = raCard.querySelector('.table-wrap');
      if (alerts.status !== 'fulfilled') {
        raBody.innerHTML = emptyState('Alerts unavailable', alerts.reason?.message || 'Could not load alerts.');
      } else if (!alertList.length) {
        raBody.innerHTML = emptyState('No alerts yet', 'Alerts raised by rules will appear here.');
      } else {
        const recent = [...alertList].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 6);
        raBody.innerHTML = `<table><tbody>${recent.map(a => `
          <tr class="clickable" data-alert="${a.id}">
            <td style="width:1%">${sevBadge(a.severity)}</td>
            <td><div style="font-weight:550">${esc(a.ruleName)}</div><div class="t-soft" style="font-size:12px">${esc(RULE_TYPE_LABEL[a.ruleType] || a.ruleType)}</div></td>
            <td>${alertStatusBadge(a.status)}</td>
            <td class="t-soft nowrap" style="text-align:right">${relTime(a.createdAt)}</td>
          </tr>`).join('')}</tbody></table>`;
        raBody.querySelectorAll('[data-alert]').forEach(tr => tr.onclick = () => openAlertDetail(tr.dataset.alert));
      }

      // Recent transactions
      const rtCard = $('#recentTxnCard', view);
      const rtBody = rtCard.querySelector('.table-wrap');
      if (txnPage.status !== 'fulfilled') {
        rtBody.innerHTML = emptyState('Transactions unavailable', txnPage.reason?.message || 'Could not load transactions.');
      } else if (!txnPage.value.content.length) {
        rtBody.innerHTML = emptyState('No transactions yet', 'Recorded transactions will appear here.');
      } else {
        rtBody.innerHTML = `<table><tbody>${txnPage.value.content.map(t => `
          <tr class="clickable" data-txn="${t.id}">
            <td><div style="font-weight:550" class="mono">${esc(t.accountId)}</div><div class="t-soft" style="font-size:12px">${relTime(t.transactionTime)}</div></td>
            <td style="text-align:right"><div class="amount">${fmtMoney(t.amount, t.currency)}</div><div>${txnStatusBadge(t.status)}</div></td>
          </tr>`).join('')}</tbody></table>`;
        rtBody.querySelectorAll('[data-txn]').forEach(tr => tr.onclick = () => openTxnDetail(tr.dataset.txn));
      }
    }

    const generateState = { count: 10 };
    async function viewGenerate(view) {
      view.innerHTML = `
        <div class="card mb-16">
          <div class="card-head"><h3>Generate sample transactions</h3></div>
          <div class="card-body">
            <div class="filters">
              <label class="fg" for="simCount">
                <span class="lbl">Number of transactions</span>

              <button class="btn btn-primary btn-sm" id="simGenerate">Generate</button>
            </div>
            <div class="t-soft" style="font-size:12.5px;margin-top:12px">Creates random transactions to populate data and trigger alert rules via <span class="mono">/api/v1/simulator/generate</span>.</div>

        </div>

        <div class="card">
          <div class="card-body">
            <div style="font-weight:600;margin-bottom:6px">How it works</div>
            <div class="t-soft" style="font-size:13px;line-height:1.6">Enter how many sample transactions you want to create. The generator uses the existing simulator backend and immediately adds new transactions that can appear in the dashboard, transactions list, and alerts flow.</div>
          </div>
        </div>`;

      const genBtn = $('#simGenerate', view);
      const countInput = $('#simCount', view);
      const submit = async () => {
        const count = Math.max(1, Math.min(200, Number(countInput.value) || 10));
        generateState.count = count;
        countInput.value = count;
        busy(genBtn, true, 'Generating…');
        try {
          const result = await api('/simulator/generate', { method: 'POST', body: JSON.stringify({ count }) });
          const created = Number(result?.createdCount ?? result?.count ?? count);
          toast('ok', 'Sample data generated', `Created ${created} transactions`);
        } catch (e) {
          toastError(e);
        } finally {
          busy(genBtn, false);
        }
      };

      genBtn.onclick = submit;
      countInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    }

    // ============================================================
    // VIEW: Transactions
    // ============================================================
    const txnState = { page: 0, size: 20, sortBy: 'transactionTime', sortDir: 'desc', filters: {} };
    async function viewTransactions(view) {
      view.innerHTML = `
        <div class="card mb-16">
          <div class="card-head">
            <h3>Filters</h3><div class="spacer"></div>
            <button class="btn btn-sm btn-ghost" id="txnReset">Clear</button>
            <button class="btn btn-primary btn-sm" id="newTxnBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Record transaction</button>
          </div>
          <div class="card-body">
            <div class="filters">
              <div class="fg"><span class="lbl">Account ID</span><input class="input" id="fAccount" placeholder="e.g. ACC-1001" value="${esc(txnState.filters.accountId || '')}"></div>
              <div class="fg"><span class="lbl">Payee ID</span><input class="input" id="fPayee" placeholder="e.g. PAY-22" value="${esc(txnState.filters.payeeId || '')}"></div>
              <div class="fg"><span class="lbl">Status</span><select class="select" id="fStatus"><option value="">Any</option>${optionList(['COMPLETED','PENDING','FAILED','PENDING_APPROVAL','REJECTED','ROLLBACK_REQUESTED','ROLLBACK_REJECTED','REFUNDED'], txnState.filters.status)}</select></div>
              <div class="fg"><span class="lbl">Type</span><select class="select" id="fType"><option value="">Any</option>${optionList(['DEBIT','CREDIT'], txnState.filters.type)}</select></div>
              <div class="fg"><span class="lbl">Min amount</span><input class="input num" id="fMin" type="number" step="0.01" min="0" placeholder="0.00" value="${esc(txnState.filters.minAmount || '')}" style="width:120px"></div>
              <div class="fg"><span class="lbl">Max amount</span><input class="input num" id="fMax" type="number" step="0.01" min="0" placeholder="Any" value="${esc(txnState.filters.maxAmount || '')}" style="width:120px"></div>
              <button class="btn btn-primary btn-sm" id="txnApply">Apply</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr><th>Account</th><th>Payee</th><th>Type</th><th style="text-align:right">Amount</th><th>Status</th><th>Time</th><th></th></tr></thead>
            <tbody id="txnBody">${skeletonRows(7, 6)}</tbody>
          </table></div>
          <div class="pager" id="txnPager" style="display:none"></div>
        </div>`;

      $('#newTxnBtn', view).onclick = openCreateTxn;
      const apply = () => {
        txnState.filters = {
          accountId: $('#fAccount', view).value.trim(),
          payeeId: $('#fPayee', view).value.trim(),
          status: $('#fStatus', view).value,
          type: $('#fType', view).value,
          minAmount: $('#fMin', view).value.trim(),
          maxAmount: $('#fMax', view).value.trim(),
        };
        txnState.page = 0;
        loadTxns(view);
      };
      $('#txnApply', view).onclick = apply;
      view.querySelectorAll('#fAccount,#fPayee,#fMin,#fMax').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); }));
      view.querySelectorAll('#fStatus,#fType').forEach(s => s.addEventListener('change', apply));
      $('#txnReset', view).onclick = () => { txnState.filters = {}; txnState.page = 0; viewTransactions(view); };

      loadTxns(view);
    }
    async function loadTxns(view) {
      const body = $('#txnBody', view); const pager = $('#txnPager', view);
      body.innerHTML = skeletonRows(7, 6); pager.style.display = 'none';
      try {
        const data = await api('/transactions' + qs({ ...txnState.filters, page: txnState.page, size: txnState.size, sortBy: txnState.sortBy, sortDir: txnState.sortDir }));
        if (!data.content.length) {
          body.innerHTML = `<tr><td colspan="7">${emptyState('No transactions found', 'Try adjusting your filters, or record a new transaction.', '<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>')}</td></tr>`;
          return;
        }
        body.innerHTML = data.content.map(t => `
          <tr class="clickable" data-txn="${t.id}">
            <td class="mono" style="font-weight:550">${esc(t.accountId)}</td>
            <td class="mono t-muted">${esc(t.payeeId)}</td>
            <td>${typeBadge(t.type)}</td>
            <td style="text-align:right" class="amount">${fmtMoney(t.amount, t.currency)}</td>
            <td>${txnStatusBadge(t.status)}</td>
            <td class="t-muted nowrap">${fmtDateShort(t.transactionTime)}</td>
            <td style="text-align:right"><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></td>
          </tr>`).join('');
        body.querySelectorAll('[data-txn]').forEach(tr => tr.onclick = () => openTxnDetail(tr.dataset.txn));
        renderPager(pager, data, (p) => { txnState.page = p; loadTxns(view); });
      } catch (e) {
        body.innerHTML = `<tr><td colspan="7">${emptyState('Could not load transactions', e.message)}</td></tr>`;
      }
    }
    function renderPager(pager, data, go) {
      const from = data.totalElements === 0 ? 0 : data.page * data.size + 1;
      const to = Math.min(data.totalElements, (data.page + 1) * data.size);
      pager.style.display = 'flex';
      pager.innerHTML = `<div class="info">Showing <b>${from}–${to}</b> of <b>${Number(data.totalElements).toLocaleString()}</b></div>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="pgPrev" ${data.first ? 'disabled' : ''}>Previous</button>
        <div class="info">Page ${data.page + 1} of ${Math.max(1, data.totalPages)}</div>
        <button class="btn btn-sm" id="pgNext" ${data.last ? 'disabled' : ''}>Next</button>`;
      pager.querySelector('#pgPrev').onclick = () => go(data.page - 1);
      pager.querySelector('#pgNext').onclick = () => go(data.page + 1);
    }

    function txnFormFields(v = {}) {
      const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
      return el(`<form class="form-grid" id="txnForm">
        <label class="field"><span class="lbl">Account ID <span class="req">*</span></span><input class="input" name="accountId" maxlength="50" required placeholder="ACC-1001" value="${esc(v.accountId || '')}"></label>
        <label class="field"><span class="lbl">Payee ID <span class="req">*</span></span><input class="input" name="payeeId" maxlength="50" required placeholder="PAY-2200" value="${esc(v.payeeId || '')}"></label>
        <label class="field"><span class="lbl">Amount <span class="req">*</span></span><input class="input num" name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" value="${esc(v.amount || '')}"></label>
        <label class="field"><span class="lbl">Currency <span class="req">*</span></span><input class="input" name="currency" required maxlength="3" placeholder="USD" style="text-transform:uppercase" value="${esc(v.currency || 'USD')}"><div class="hint">3-letter ISO code</div></label>
        <label class="field"><span class="lbl">Type <span class="req">*</span></span><select class="select" name="type">${optionList(['DEBIT','CREDIT'], v.type || 'DEBIT')}</select></label>
        <label class="field"><span class="lbl">Status <span class="req">*</span></span><select class="select" name="status">${optionList(['COMPLETED','PENDING','FAILED'], v.status || 'COMPLETED')}</select></label>
        <label class="field full"><span class="lbl">Transaction time <span class="req">*</span></span><input class="input" name="transactionTime" type="datetime-local" required value="${v.transactionTime || nowLocal()}"></label>
        <label class="field full"><span class="lbl">Description</span><input class="input" name="description" maxlength="255" placeholder="Optional note" value="${esc(v.description || '')}"></label>
      </form>`);
    }
    function openCreateTxn() {
      const form = txnFormFields();
      let submitBtn;
      const footer = footerButtons([
        { label: 'Cancel', class: 'btn-ghost', onClick: closeModal },
        { label: 'Record transaction', class: 'btn-primary', ref: b => submitBtn = b, onClick: submit },
      ]);
      openModal({ title: 'Record transaction', sub: 'Submit a transaction into the monitoring system.', body: form, footer });
      form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
      async function submit() {
        if (!form.reportValidity()) return;
        const fd = new FormData(form);
        const payload = {
          accountId: fd.get('accountId').trim(),
          payeeId: fd.get('payeeId').trim(),
          amount: Number(fd.get('amount')),
          currency: fd.get('currency').trim().toUpperCase(),
          type: fd.get('type'), status: fd.get('status'),
          transactionTime: new Date(fd.get('transactionTime')).toISOString(),
          description: fd.get('description').trim() || null,
        };
        busy(submitBtn, true, 'Recording…');
        try {
          const t = await api('/transactions', { method: 'POST', body: JSON.stringify(payload) });
          closeModal();
          toast('ok', 'Transaction recorded', `${fmtMoney(t.amount, t.currency)} · ${t.accountId}`);
          if (currentRoute === 'transactions') loadTxns($('#view'));
          if (currentRoute === 'dashboard') viewDashboard($('#view'));
        } catch (e) { toastError(e); busy(submitBtn, false); }
      }
    }
    async function openTxnDetail(id) {
      const body = el('<div><div class="table-wrap"><table><tbody>' + skeletonRows(2, 5) + '</tbody></table></div></div>');
      const overlay = openModal({ title: 'Transaction', sub: 'Reference ' + shortId(id), body, wide: false, footer: document.createDocumentFragment() });
      try {
        const t = await api('/transactions/' + id);
        const extra = [];
        if (t.reviewedBy) extra.push(`<dt>Reviewed by</dt><dd>${esc(t.reviewedBy)} <span class="t-muted">· ${fmtDate(t.reviewedAt)}</span></dd>`);
        if (t.reviewNote) extra.push(`<dt>Review note</dt><dd>${esc(t.reviewNote)}</dd>`);
        if (t.rollbackReasonCode) extra.push(`<dt>Rollback reason</dt><dd>${esc(t.rollbackReasonCode)} — ${esc(t.rollbackReasonDetail || '')}</dd>`);
        if (t.rollbackRequestedBy) extra.push(`<dt>Rollback requested by</dt><dd>${esc(t.rollbackRequestedBy)} <span class="t-muted">· ${fmtDate(t.rollbackRequestedAt)}</span></dd>`);
        if (t.rollbackReviewedBy) extra.push(`<dt>Rollback reviewed by</dt><dd>${esc(t.rollbackReviewedBy)} <span class="t-muted">· ${fmtDate(t.rollbackReviewedAt)}</span></dd>`);
        if (t.rollbackReviewNote) extra.push(`<dt>Rollback review note</dt><dd>${esc(t.rollbackReviewNote)}</dd>`);
        if (t.refundTransactionId) extra.push(`<dt>Refund transaction</dt><dd class="mono clickable" data-txn="${t.refundTransactionId}">${shortId(t.refundTransactionId)}</dd>`);
        if (t.refundedForTransactionId) extra.push(`<dt>Refund for</dt><dd class="mono clickable" data-txn="${t.refundedForTransactionId}">${shortId(t.refundedForTransactionId)}</dd>`);

        body.innerHTML = `
          <dl class="detail-list">
            <dt>Transaction ID</dt><dd class="mono">${esc(t.id)}</dd>
            <dt>Account ID</dt><dd class="mono">${esc(t.accountId)}</dd>
            <dt>Payee ID</dt><dd class="mono">${esc(t.payeeId)}</dd>
            <dt>Amount</dt><dd class="amount">${fmtMoney(t.amount, t.currency)}</dd>
            <dt>Type</dt><dd>${typeBadge(t.type)}</dd>
            <dt>Status</dt><dd>${txnStatusBadge(t.status)}</dd>
            <dt>Transaction time</dt><dd>${fmtDate(t.transactionTime)}</dd>
            <dt>Description</dt><dd>${t.description ? esc(t.description) : '<span class="t-soft">—</span>'}</dd>
            <dt>Created</dt><dd class="t-muted">${fmtDate(t.createdAt)}</dd>
            <dt>Updated</dt><dd class="t-muted">${fmtDate(t.updatedAt)}</dd>
            ${extra.join('')}
          </dl>`;
        body.querySelectorAll('[data-txn]').forEach(dd => dd.onclick = () => openTxnDetail(dd.dataset.txn));

        const foot = overlay.querySelector('.modal-foot');
        foot.innerHTML = '';
        const cancel = el('<button class="btn btn-ghost">Close</button>'); cancel.onclick = closeModal; foot.append(cancel);
        const onDone = () => { closeModal(); if (currentRoute === 'transactions') loadTxns($('#view')); else if (currentRoute === 'dashboard') viewDashboard($('#view')); };
        if (t.status === 'PENDING_APPROVAL') {
          const rej = el('<button class="btn btn-danger btn-sm">Reject</button>');
          rej.onclick = () => promptTxnDecision(t, 'reject', onDone);
          foot.append(rej);
          const app = el('<button class="btn btn-primary btn-sm">Approve</button>');
          app.onclick = () => promptTxnDecision(t, 'approve', onDone);
          foot.append(app);
        } else if (t.status === 'COMPLETED') {
          const rb = el('<button class="btn btn-primary btn-sm">Request rollback</button>');
          rb.onclick = () => promptTxnRollbackRequest(t, onDone);
          foot.append(rb);
        } else if (t.status === 'ROLLBACK_REQUESTED') {
          const rej = el('<button class="btn btn-danger btn-sm">Reject rollback</button>');
          rej.onclick = () => promptTxnRollbackDecision(t, 'reject', onDone);
